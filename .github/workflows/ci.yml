# Validação de cada PR e de cada push fora da main: as mesmas etapas da esteira de versão (release.yml), sem
# publicar nada. O APK sai como artefato da execução (assinado com chave de debug), para testar no celular.
name: CI

on:
  pull_request:
    paths: ['app/**', 'assets/**', 'mobile/**', '.github/workflows/**']
  push:
    branches-ignore: [main]
    paths: ['app/**', 'assets/**', 'mobile/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

# um push novo na mesma branch cancela a conferência anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (testes)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Testes
        working-directory: app
        run: cargo test --workspace

  android:
    name: Android (testes, lint e APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes, lint e APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: BlueScreen-android-teste
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  ios:
    name: iOS (app instalável)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node mobile/ios/verificar-pwa.mjs
