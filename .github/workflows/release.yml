# Esteira de versão: cada push na main que mexe no aplicativo vira um Release do GitHub (tag vX.Y.Z) com
#   - BlueScreen-Setup-X.Y.Z.exe   instalador do Windows (Inno Setup, app/installer/BlueScreen.iss)
#   - BlueScreen-X.Y.Z-windows-x64.zip   o que o atualizador da IDE e o Instalar BlueScreen.cmd baixam
#   - BlueScreen-X.Y.Z-android.apk   o app do Android (mobile/android), que também vai dentro do zip e do
#     instalador: a página /instalar da IDE entrega ele pela rede local, sem internet
# O iPhone não tem arquivo: o app dele é a própria interface, instalada pelo Safari (PWA, mobile/ios); a etapa
# "iOS" confere que o que o Safari precisa para instalar está no lugar.
#
#   versão ─┬─ Windows (testes + compilação) ─┐
#           ├─ Android (testes + lint + APK) ─┼─ pacote e Release (instalador, zip, APK, SHA-256)
#           └─ iOS (app instalável conferido) ┘
#
# Número da versão: X.Y vem do app/Cargo.toml (mude lá para subir a versão maior ou a menor); Z é o próximo número
# livre entre as tags vX.Y.* (a primeira de uma série X.Y usa o Z do Cargo.toml). O Cargo.toml do repositório não
# é alterado: a versão entra só na compilação daqui (BlueScreen.exe, "Configurações > Apps" e o versionName do APK).
# Para um push não gerar versão, ponha [skip release] na mensagem do commit.
#
# Assinatura do APK (secrets do repositório): ANDROID_KEYSTORE_BASE64 (o .jks em base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD. Sem eles o APK sai com uma chave de debug descartável: instala, mas a
# versão seguinte não atualiza por cima (o Android recusa assinatura diferente). Guia em docs/CELULAR.md.
name: Release

on:
  push:
    branches: [main]
    paths: ['app/**', 'assets/**', 'mobile/**', 'Instalar BlueScreen.cmd', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

# uma de cada vez: duas versões ao mesmo tempo pegariam o mesmo número
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  versao:
    name: Versão
    # só a main publica ("Run workflow" em outra branch não vira a versão latest de todo mundo)
    if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # as tags e o histórico, para o número da versão e a lista de mudanças

      - name: Número da versão e o que mudou
        id: ver
        run: |
          $toml = [IO.File]::ReadAllText('app/Cargo.toml')
          $m = [regex]::Match($toml, '(?m)^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"')
          if (-not $m.Success) { throw 'versão não encontrada em app/Cargo.toml' }
          $maj = [int]$m.Groups[1].Value; $min = [int]$m.Groups[2].Value; $pat = [int]$m.Groups[3].Value
          $used = @(git tag --list "v$maj.$min.*" | ForEach-Object { if ($_ -match '^v\d+\.\d+\.(\d+)$') { [int]$Matches[1] } })
          if ($used.Count) { $pat = [Math]::Max($pat, ($used | Measure-Object -Maximum).Maximum + 1) }
          $v = "$maj.$min.$pat"
          # o que mudou desde a versão anterior (vira a lista "O que mudou" no atualizador da IDE)
          $prev = git describe --tags --abbrev=0 --match 'v*' 2>$null
          $range = if ($prev) { "$prev..HEAD" } else { 'HEAD' }
          $log = @(git log --no-merges -n 80 --format='- %s (%h)' $range | Where-Object { $_ -notmatch '\[skip release\]' })
          $notes = if ($log.Count) { $log -join "`n" } else { '- Recompilação sem mudanças de código' }
          New-Item -ItemType Directory -Force notas | Out-Null
          [IO.File]::WriteAllText("notas/notes.md", $notes)
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "BlueScreen $v (anterior: $prev)"
          "### BlueScreen $v`n`nAnterior: ``$prev``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: notas
          path: notas/notes.md
          retention-days: 3

  windows:
    name: Windows
    needs: versao
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # dependências compiladas ficam guardadas entre as versões: só o código do BlueScreen recompila
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Versão na compilação
        run: |
          $file = 'app/Cargo.toml'; $v = '${{ needs.versao.outputs.version }}'
          $toml = [IO.File]::ReadAllText($file)
          [IO.File]::WriteAllText($file, ([regex]'(?m)^version\s*=\s*"\d+\.\d+\.\d+"').Replace($toml, "version = `"$v`"", 1))

      - name: Testes
        working-directory: app
        run: cargo test --workspace --release

      - name: Compilar
        working-directory: app
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: app/dist/BlueScreen
          if-no-files-found: error
          retention-days: 3

  android:
    name: Android
    needs: versao
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    env:
      BS_VERSION: ${{ needs.versao.outputs.version }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # a chave sai do secret só para um arquivo temporário do runner, que some com ele
      - name: Chave de assinatura
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # quebras de linha (um secret colado ou gravado pelo Windows) não fazem parte do base64
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/bluescreen.jks"
          echo "BS_ANDROID_KEYSTORE=$RUNNER_TEMP/bluescreen.jks" >> "$GITHUB_ENV"

      - name: Testes, lint e APK
        env:
          BS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease -PbsVersion="$BS_VERSION"

      - name: Conferir a assinatura
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$signer" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning title=APK com chave de debug::Sem os secrets ANDROID_KEYSTORE_*, o APK desta versão não atualiza por cima da anterior. Veja docs/CELULAR.md."
          fi
          mkdir -p "$GITHUB_WORKSPACE/saida"
          cp "$apk" "$GITHUB_WORKSPACE/saida/BlueScreen-$BS_VERSION-android.apk"
          echo "APK $BS_VERSION: $(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: saida/*.apk
          if-no-files-found: error
          retention-days: 3

  ios:
    name: iOS (app instalável)
    needs: versao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Conferir o PWA (manifesto, ícones, páginas, /instalar e QR code)
        run: node mobile/ios/verificar-pwa.mjs

  publicar:
    name: Pacote e Release
    needs: [versao, windows, android, ios]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: app/dist/BlueScreen

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: saida

      - uses: actions/download-artifact@v4
        with:
          name: notas
          path: notas

      # o APK vai dentro da IDE (o mesmo lugar do build.ps1 -Apk): a página /instalar entrega ele pela rede local
      - name: App Android dentro da IDE
        run: |
          $apk = Get-ChildItem saida -Filter *.apk | Select-Object -First 1
          New-Item -ItemType Directory -Force app/dist/BlueScreen/wwwroot/mobile | Out-Null
          Copy-Item $apk.FullName app/dist/BlueScreen/wwwroot/mobile/BlueScreen.apk

      # instalador clássico (assistente: pasta, atalhos, desinstalador), feito com o Inno Setup
      - name: Instalador (.exe)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ needs.versao.outputs.version }}" app/installer/BlueScreen.iss
          if ($LASTEXITCODE) { throw "ISCC terminou com código $LASTEXITCODE" }

      - name: Empacotar
        id: pkg
        run: |
          $v = '${{ needs.versao.outputs.version }}'
          $zip = "BlueScreen-$v-windows-x64.zip"; $setup = "BlueScreen-Setup-$v.exe"; $apk = "BlueScreen-$v-android.apk"
          # o conteúdo de dist\BlueScreen na raiz do zip (BlueScreen.exe, wwwroot\, plugins\): é o que o atualizador da IDE baixa
          Compress-Archive -Path 'app/dist/BlueScreen/*' -DestinationPath $zip -CompressionLevel Optimal
          Copy-Item "app/dist/$setup" $setup
          Copy-Item "saida/$apk" $apk
          foreach ($f in $zip, $setup, $apk) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("$f.sha256", "$hash  $f`n")
            Write-Host ("{0}: {1:N1} MB, sha256 {2}" -f $f, ((Get-Item $f).Length / 1MB), $hash)
            ("- ``{0}`` {1:N1} MB" -f $f, ((Get-Item $f).Length / 1MB)) >> $env:GITHUB_STEP_SUMMARY
          }
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "setup=$setup" >> $env:GITHUB_OUTPUT
          "apk=$apk" >> $env:GITHUB_OUTPUT

      - name: Publicar o Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ needs.versao.outputs.version }}'; $zip = '${{ steps.pkg.outputs.zip }}'; $setup = '${{ steps.pkg.outputs.setup }}'; $apk = '${{ steps.pkg.outputs.apk }}'
          $notes = 'notas/notes.md'
          # instalador primeiro: é o que a maioria baixa na página do Release
          [IO.File]::AppendAllText($notes, "`n`n**Instalar:** baixe o ``$setup`` e siga o assistente. Quem já tem o BlueScreen recebe esta versão pela própria IDE." +
            "`n`n**Celular:** no Android, instale o ``$apk`` (ou abra http://<ip-do-pc>:4748/instalar com a Rede local ligada). No iPhone, abra esse mesmo endereço no Safari e toque em Compartilhar › Adicionar à Tela de Início.")
          gh release create "v$v" $setup "$setup.sha256" $zip "$zip.sha256" $apk "$apk.sha256" --target $env:GITHUB_SHA --title "BlueScreen $v" --notes-file $notes --latest
